name: Finalize STAR7 branding
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply reviewed branding and start CI and Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          from pathlib import Path
          def api(path, data=None, method=None):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method=method)
              with urllib.request.urlopen(req) as r:
                  body=r.read()
                  return json.loads(body) if body else None
          base=api('git/ref/heads/main')['object']['sha']
          assert base==os.environ['GITHUB_SHA'], 'main changed; rerun safely'
          commit=api('git/commits/'+base)
          rules={
            'crates/ui-egui/src/dialogs.rs': [('crate::tl!("About CADCraft")','crate::tl!("About STAR CAD")'),('crate::tl!("CADCraft")','"STAR CAD"'),('crate::tl!("One of the Crafting Apps by the ArtCraft team and community.")','"STAR7 Suite"'),('ui.hyperlink_to("getartcraft.com/apps/cadcraft", "https://getartcraft.com/apps/cadcraft");','ui.hyperlink_to("suite.star-7.app.br", "https://suite.star-7.app.br");'),('ui.hyperlink_to(crate::tl!("Join us on Discord"), "https://discord.gg/artcraft");','ui.hyperlink_to("GitHub", "https://github.com/Devstar7/cadcraft");')],
            'crates/ui-egui/src/menus.rs': [('About CADCraft','About STAR CAD'),('CADCraft Help','STAR CAD Help'),('Quit CADCraft','Quit STAR CAD')],
            'apps/cadcraft/src/native_menu.rs': [('"CADCraft"','"STAR CAD"'),('About CADCraft','About STAR CAD'),('Hide CADCraft','Hide STAR CAD'),('Quit CADCraft','Quit STAR CAD'),('Join the ArtCraft Discord…','Portal STAR7 Suite…'),('https://discord.gg/artcraft','https://suite.star-7.app.br')],
            'crates/ui-egui/src/chrome.rs': [('format!("CADCraft      ','format!("STAR CAD      '),('crate::tl!("CADCraft")','"STAR CAD"')],
            'crates/ui-egui/src/i18n/tests.rs': [('"About CADCraft"','"About STAR CAD"')],
            '.github/workflows/release.yml': [('app-title: CADCraft','app-title: STAR CAD')]
          }
          entries=[]
          for file,reps in rules.items():
              src=Path(file).read_text(); out=src
              for a,b in reps:
                  assert a in out or b in out,(file,a)
                  out=out.replace(a,b)
              if out!=src: entries.append({'path':file,'mode':'100644','type':'blob','content':out})
          keys=['About CADCraft','CADCraft Help','Quit CADCraft','Hide CADCraft']
          for p in Path('crates/ui-egui/src/i18n').glob('*.tsv'):
              src=p.read_text(); out=src
              for line in src.splitlines():
                  parts=line.split('\t')
                  if len(parts)==3 and parts[1] in keys:
                      out=out.replace(line,'\t'.join([parts[0],parts[1].replace('CADCraft','STAR CAD'),parts[2].replace('CADCraft','STAR CAD')]))
              if p.name=='pt_br.tsv' and '\tPortal STAR7 Suite…\t' not in out: out+='\n\tPortal STAR7 Suite…\tPortal STAR7 Suite…\n'
              seen=set()
              for line in out.splitlines():
                  if not line or line.startswith('#'): continue
                  parts=line.split('\t'); assert len(parts)==3,(str(p),line)
                  key=(parts[0],parts[1]); assert key not in seen,(str(p),key); seen.add(key)
              if src!=out: entries.append({'path':str(p),'mode':'100644','type':'blob','content':out})
          assert entries, 'Already applied'
          tree=api('git/trees',{'base_tree':commit['tree']['sha'],'tree':entries})
          saved=api('git/commits',{'message':'Finalize STAR CAD Help/About branding and STAR7 portal links','tree':tree['sha'],'parents':[base]})
          api('git/refs/heads/main',{'sha':saved['sha'],'force':False},'PATCH')
          api('actions/workflows/ci.yml/dispatches',{'ref':'main'})
          api('actions/workflows/release.yml/dispatches',{'ref':'main'})
          print('STAR CAD saved: '+saved['sha']+'; CI and Release requested')
